<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>woddwill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 15% 20%, #1e1b4b, #09090b 45%, #050507 100%);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --card-hover-bg: rgba(255, 255, 255, 0.06);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 860px;
    }

    header {
      margin-bottom: 2.5rem;
      text-align: left;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 0.85rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .app-card {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1.3rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .app-card:hover {
      background: var(--card-hover-bg);
      border-color: var(--card-hover-border);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5), 0 0 20px -5px rgba(99, 102, 241, 0.15);
    }

    .icon-box {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e4e4e7;
      transition: all 0.22s ease;
    }

    .app-card:hover .icon-box {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .icon-box svg {
      width: 22px;
      height: 22px;
      stroke-width: 1.8;
    }

    .card-info {
      flex-grow: 1;
    }

    .card-info h2 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-info h2 .arrow {
      opacity: 0;
      transform: translateX(-4px);
      transition: all 0.2s ease;
      font-size: 0.9rem;
      color: var(--accent);
    }

    .app-card:hover .card-info h2 .arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .card-info p {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #52525b;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">
        <span class="badge-dot"></span>
  
      </div>
      <h1></h1>
      <p class="subtitle"></p>
    </header>

    <main class="grid">
      <!-- 1. Melvor-->
      <a href="Melvor.html" class="app-card">
        <div class="icon-box">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <div class="card-info">
          <h2>Melvor <span class="arrow">→</span></h2>
          <p></p>
        </div>
      </a>

      <!-- 2. Kelime Kutusu -->
      <a href="kelimekutusu/" class="app-card">
        <div class="icon-box">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
        </div>
        <div class="card-info">
          <h2>Kelime Kutusu <span class="arrow">→</span></h2>
          <p></p>
        </div>
      </a>

      <!-- 3. Yedek -->
      <!-- İhtiyacınıza göre href="dosya-adiniz.html" yapabilirsiniz -->
      <a href="#" class="app-card" style="opacity: 0.65;">
        <div class="icon-box">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
        </div>
        <div class="card-info">
          <h2>Yeni Uygulama <span class="arrow">→</span></h2>
          <p>Geliştirilmekte olan bir sonraki kişisel araç.</p>
        </div>
      </a>
    </main>

    <footer>
      <span>&bull; Kişisel Portal</span>
    </footer>
  </div>

</body>
</html>
