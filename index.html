<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>woddwill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF0; --surface:#F7F9FA; --ink:#14202B; --muted:#5B6B78; --line:#CBD6DB;
  --focus:#2447F5;
  --font:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F161C; --surface:#18222B; --ink:#EAF0F3; --muted:#8FA0AC; --line:#2A3945; --focus:#8AA2FF}
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.5;
  padding:clamp(20px,5vw,64px);max-width:1120px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:24px;margin-bottom:clamp(28px,6vw,56px)}
.greet{color:var(--muted);font-size:1rem;margin-bottom:8px}
h1{font-size:clamp(2.6rem,9vw,5.5rem);font-weight:800;line-height:.95;letter-spacing:-.03em}
.search{position:relative;width:min(100%,280px)}
.search input{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:999px;padding:12px 44px 12px 18px}
.search input::placeholder{color:var(--muted)}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:inherit;font-size:.8rem;
  color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 7px}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.tile{--c:#2447F5;--on:#fff;position:relative;display:flex;flex-direction:column;justify-content:space-between;
  min-height:240px;padding:26px;border-radius:28px;background:var(--c);color:var(--on);text-decoration:none;
  grid-column:span 2;overflow:hidden;transition:transform .2s ease,border-radius .2s ease}
.tile:nth-child(1){grid-column:span 4;min-height:300px}
.tile:nth-child(2){grid-column:span 2}
.tile:hover{transform:translateY(-4px);border-radius:20px 40px 20px 40px}
.glyph{font-size:clamp(5rem,14vw,9rem);font-weight:800;line-height:.8;letter-spacing:-.05em;opacity:.22;
  position:absolute;right:18px;top:18px;user-select:none}
.tile h2{font-size:clamp(1.6rem,3.4vw,2.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.tile p{margin-top:8px;max-width:30ch;opacity:.85;font-size:1rem}
.go{margin-top:18px;align-self:flex-start;font-weight:600;font-size:.95rem;padding:8px 16px;border-radius:999px;
  background:var(--on);color:var(--c)}
.tile[hidden]{display:none}
.empty{display:none;padding:40px 0;color:var(--muted);font-size:1.1rem}
.empty.show{display:block}
footer{margin-top:48px;color:var(--muted);font-size:.9rem}

@media(max-width:760px){
  .grid{grid-template-columns:1fr}
  .tile,.tile:nth-child(n){grid-column:auto;min-height:190px}
}
@media(prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>
</head>
<body>
<header>
  <div>
    <p class="greet" id="greet">Merhaba</p>
   
  </div>
  <label class="search">
    <input id="q" type="search" placeholder="Uygulama ara" aria-label="Uygulama ara" autocomplete="off">
    <kbd aria-hidden="true">/</kbd>
  </label>
</header>

<main>
  <nav class="grid" id="grid" aria-label="Uygulamalar"></nav>
  <p class="empty" id="empty">Eşleşen uygulama yok. Aramayı temizleyip tekrar dene.</p>
</main>

<footer id="foot"></footer>

<script>
/* Uygulamalarını buradan düzenle: name, desc, href (kendi adresin), color (kart rengi), on (yazı rengi) */
const APPS = [
  { name:"Kelime Kutusu",     desc:"",  href:"#", color:"#2447F5", on:"#FFFFFF" },
  { name:"Melvor",            desc:"",            href:"#", color:"#F2B632", on:"#14202B" },
  
];

const grid = document.getElementById('grid');
const q = document.getElementById('q');
const empty = document.getElementById('empty');
const lower = s => s.toLocaleLowerCase('tr');

APPS.forEach(a => {
  const el = document.createElement('a');
  el.className = 'tile';
  el.href = a.href;
  el.style.setProperty('--c', a.color);
  el.style.setProperty('--on', a.on);
  el.dataset.key = lower(a.name + ' ' + a.desc);
  const glyph = document.createElement('span'); glyph.className = 'glyph'; glyph.setAttribute('aria-hidden','true'); glyph.textContent = a.name.charAt(0);
  const box = document.createElement('div');
  const h = document.createElement('h2'); h.textContent = a.name;
  const p = document.createElement('p'); p.textContent = a.desc;
  box.append(h, p);
  const go = document.createElement('span'); go.className = 'go'; go.textContent = 'Aç';
  el.append(glyph, box, go);
  grid.appendChild(el);
});

q.addEventListener('input', () => {
  const v = lower(q.value.trim());
  let shown = 0;
  grid.querySelectorAll('.tile').forEach(t => {
    const ok = !v || t.dataset.key.includes(v);
    t.hidden = !ok; if (ok) shown++;
  });
  empty.classList.toggle('show', shown === 0);
});
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const t = grid.querySelector('.tile:not([hidden])'); if (t) t.click(); }
  if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});

const hr = new Date().getHours();
document.getElementById('greet').textContent =
  hr < 6 ? 'İyi geceler' : hr < 12 ? 'Günaydın' : hr < 18 ? 'İyi günler' : 'İyi akşamlar';
document.getElementById('foot').textContent =
  new Date().toLocaleDateString('tr-TR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
</script>
</body>
</html>
