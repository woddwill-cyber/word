<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melvor Idle XP Hesaplayıcı</title>
<style>
:root{--bg:#f1ede3;--panel:#fbf9f3;--ink:#2a2620;--mute:#6e675a;--line:#d8d1c0;--gold:#9a6a12;--field:#fff;--hit:#e9dcb8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a20;--panel:#1f242c;--ink:#ebe6d8;--mute:#9a9484;--line:#333a45;--gold:#e3ab3f;--field:#161a20;--hit:#3a321f}}
:root[data-theme="dark"]{--bg:#171a20;--panel:#1f242c;--ink:#ebe6d8;--mute:#9a9484;--line:#333a45;--gold:#e3ab3f;--field:#161a20;--hit:#3a321f}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:460px;margin:0 auto;padding:20px 14px 32px}
h1{font:700 22px/1.2 Georgia,serif;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:2px}
input{width:100%;font:500 16px inherit;font-family:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.need{margin-top:12px;padding:9px 12px;background:var(--hit);border-radius:4px;display:flex;justify-content:space-between;align-items:baseline}
.need b{font:700 20px Georgia,serif;color:var(--gold)}
dl{margin:0;display:grid;grid-template-columns:1fr auto}
dt,dd{margin:0;padding:6px 0;border-bottom:1px solid var(--line)}
dt:nth-last-of-type(1),dd:last-child{border-bottom:0}
dt{color:var(--mute)}
dd{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
button{font:600 14px inherit;font-family:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;width:100%;margin-top:12px}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
#cnt{display:none;margin-top:12px}
#cnt.on{display:block}
.err{color:#b3392b;font-size:13px;margin-top:6px}
.err:empty{display:none}
</style>
</head>
<body>
<main>
<h1>Melvor Idle XP Hesaplayıcı</h1>
<div class="card">
<div class="grid">
<div><label for="cl">Mevcut seviye</label><input id="cl" type="number" inputmode="numeric" min="1" max="120" value="1"></div>
<div><label for="tl">Hedef seviye</label><input id="tl" type="number" inputmode="numeric" min="1" max="120" value="99"></div>
<div><label for="cx">Mevcut XP</label><input id="cx" type="number" inputmode="numeric" min="0" value="0"></div>
<div><label for="tx">Hedef XP</label><input id="tx" type="number" inputmode="numeric" min="0" value="0"></div>
</div>
<div class="need"><span>Kalan XP</span><b id="need">0</b></div>
<div class="err" id="err" role="alert"></div>
<hr>
<div class="grid">
<div><label for="axp">Aksiyon başına XP</label><input id="axp" type="number" inputmode="decimal" min="0" step="any" value="495"></div>
<div><label for="asec">Aksiyon süresi (sn)</label><input id="asec" type="number" inputmode="decimal" min="0.05" step="any" value="7"></div>
</div>
<hr>
<dl>
<dt>Gereken aksiyon</dt><dd id="r-act">–</dd>
<dt>Toplam süre</dt><dd id="r-time">–</dd>
<dt>Saat</dt><dd id="r-hr">–</dd>
</dl>
<button id="tog" type="button" aria-expanded="false" aria-controls="cnt">Aksiyon sayısı gir</button>
<div id="cnt">
<label for="n">Aksiyon sayısı</label><input id="n" type="number" inputmode="numeric" min="0" step="1" value="1000">
<dl style="margin-top:8px">
<dt>Süre</dt><dd id="c-time">–</dd>
<dt>Saat</dt><dd id="c-hr">–</dd>
<dt>Kazanılacak XP</dt><dd id="c-xp">–</dd>
<dt>Sonraki seviye</dt><dd id="c-lv">–</dd>
</dl>
</div>
</div>
</main>
<script>
// toplam XP(L+1) = floor( toplam(floor(l + 300*2^(l/7))) / 4 )
const MAXL = 120, T = [0, 0];
(function(){ let a = 0; for (let l = 1; l < MAXL; l++) { a += Math.floor(l + 300 * Math.pow(2, l / 7)); T[l + 1] = Math.floor(a / 4); } })();
const $ = id => document.getElementById(id);
const fmt = (n, d = 0) => n.toLocaleString('tr-TR', {maximumFractionDigits: d});
const num = id => { const v = parseFloat($(id).value); return isFinite(v) ? v : NaN; };
const levelOf = xp => { let L = 1; for (let i = 1; i <= MAXL; i++) if (T[i] <= xp) L = i; return L; };
const lvToXp = (lv, xp) => { $(xp).value = T[Math.min(MAXL, Math.max(1, Math.round(num(lv)) || 1))]; };
const xpToLv = (xp, lv) => { $(lv).value = levelOf(Math.max(0, num(xp) || 0)); };

function dur(sec){
  sec = Math.round(sec);
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60, p = [];
  if (d) p.push(d + ' gün'); if (h) p.push(h + ' sa'); if (m) p.push(m + ' dk');
  if (s || !p.length) p.push(s + ' sn');
  return p.join(' ');
}

function calc(){
  const cx = num('cx') || 0, tx = num('tx') || 0, need = Math.max(0, tx - cx);
  $('need').textContent = fmt(need);
  $('err').textContent = tx < cx ? 'Hedef XP mevcut XP\u2019den düşük.' : '';
  const xp = num('axp'), sec = num('asec');
  const n = Math.max(0, Math.floor(num('n')) || 0);
  if (!(xp >= 0 && sec > 0)) { ['r-act','r-time','r-hr','c-time','c-hr','c-xp','c-lv'].forEach(i => $(i).textContent = '–'); return; }
  $('c-time').textContent = dur(n * sec);
  $('c-hr').textContent = fmt(n * sec / 3600, 2);
  $('c-xp').textContent = fmt(n * xp);
  $('c-lv').textContent = levelOf(cx + n * xp);
  if (!(xp > 0)) { ['r-act','r-time','r-hr'].forEach(i => $(i).textContent = '–'); return; }
  const acts = Math.ceil(need / xp);
  $('r-act').textContent = fmt(acts);
  $('r-time').textContent = dur(acts * sec);
  $('r-hr').textContent = fmt(acts * sec / 3600, 2);
}

$('cl').oninput = () => { lvToXp('cl','cx'); calc(); };
$('tl').oninput = () => { lvToXp('tl','tx'); calc(); };
$('cx').oninput = () => { xpToLv('cx','cl'); calc(); };
$('tx').oninput = () => { xpToLv('tx','tl'); calc(); };
$('axp').oninput = calc; $('asec').oninput = calc; $('n').oninput = calc;
$('tog').onclick = () => {
  const on = $('cnt').classList.toggle('on');
  $('tog').setAttribute('aria-expanded', on);
  $('tog').textContent = on ? 'Aksiyon sayısını gizle' : 'Aksiyon sayısı gir';
};
lvToXp('cl','cx'); lvToXp('tl','tx'); calc();
</script>
</body>
</html>
